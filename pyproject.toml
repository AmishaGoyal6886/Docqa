[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docqa-rag-api"
version = "0.1.0"
description = "A local-first RAG question-answering API for PDF documents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiomysql>=0.2.0",
  "faiss-cpu>=1.8.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "pydantic-settings>=2.5.0",
  "pypdf>=5.0.0",
  "python-multipart>=0.0.9",
  "sentence-transformers>=3.0.0",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.6.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
